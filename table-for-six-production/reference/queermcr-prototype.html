.people-tabs{display:flex;gap:9px;margin:14px 0 4px}.swipe-layout{display:grid;grid-template-columns:minmax(290px,480px) minmax(270px,1fr);gap:28px;align-items:start}.swipe-zone{min-width:0;max-width:490px;margin-inline:auto;width:100%}.swipe-counter{text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 13px}.swipe-stack{position:relative;padding:0 9px 14px;isolation:isolate}.swipe-shadow{position:absolute;border:2px solid var(--ink);border-radius:24px;left:17px;right:17px;bottom:4px;top:14px;background:var(--lilac);z-index:-1;transform:rotate(3deg)}.swipe-shadow.shadow-two{left:21px;right:21px;top:17px;bottom:2px;transform:rotate(-3deg);background:var(--blue)}.swipe-card{position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:0 12px 20px #2424241a;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .2s ease}.swipe-card.dragging{cursor:grabbing;transition:none}.swipe-portrait{height:240px;display:grid;place-items:center;position:relative;background:var(--pink)}.swipe-portrait.blue{background:var(--blue)}.swipe-portrait.cream{background:var(--lilac)}.swipe-emoji{font-size:95px;filter:drop-shadow(0 12px 1px #24242412)}.swipe-image-caption{position:absolute;bottom:14px;left:14px;background:var(--cream);font-weight:800;font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid #24242433}.swipe-content{padding:22px}.swipe-content h2{font-size:29px}.swipe-content .subtitle{min-height:62px}.swipe-prompt{background:var(--cream);border-radius:15px;padding:12px 15px;margin:16px 0}.swipe-prompt small{font-weight:900;letter-spacing:.07em}.swipe-prompt p{margin:7px 0 0;line-height:1.4}.swipe-view{background:none;border:0;text-decoration:underline;font-weight:800;padding:3px 0}.swipe-actions{display:flex;gap:20px;align-items:center;justify-content:center;margin-top:18px}.round-action{border:2px solid var(--ink);border-radius:50%;width:66px;height:66px;display:grid;place <script>
'use strict';const storage='queermcr-tfs-v4';const seedPeople=[{id:'alex',name:'Alex',age:27,area:'Manchester',bio:'Looking for gig buddies, spontaneous pub trips and people who also have 400 unfinished hobbies.',interests:['Live music','Food','Nights out'],goal:'Gig buddies',prompt:'You can win me over with a really niche music recommendation.',emoji:'🎸',colour:'pink',mode:'Chatty'},{id:'jules',name:'Jules',age:29,area:'Salford',bio:'Bookshops, coffee shops, art galleries and extremely elaborate Sunday plans.',interests:['Books','Coffee','Art'],goal:'Close friends',prompt:'My ideal day involves a bookshop followed by three hours of yapping.',emoji:'☕',colour:'blue',mode:'Calm'},{id:'frankie',name:'Frankie',age:26,area:'Stockport',bio:'Always up for the cinema, a walk, or an excuse to find somewhere new to eat.',interests:['Films','Walks','Food'],goal:'Activity buddies',prompt:'Let’s find the best chips in Manchester.',emoji:'🌿',colour:'cream',mode:'Balanced'},{id:'sam',name:'Sam',age:31,area:'Manchester',bio:'Trying to turn my collection of hobbies into actual plans with people.',interests:['Gaming','Art','Books'],goal:'Close friends',prompt:'Send me your best board game recommendation.',emoji:'🎲',colour:'pink',mode:'Calm'},{id:'robin',name:'Robin',age:28,area:'Trafford',bio:'Live music, coffee, galleries and finding the best vegetarian spots.',interests:['Live music','Coffee','Food'],goal:'Activity buddies',prompt:'You’re up for a last-minute exhibition.',emoji:'🎨',colour:'blue',mode:'Balanced'},{id:'charlie',name:'Charlie',age:25,area:'Salford',bio:'New friends for gigs, pub quizzes and chaotic movie nights.',interests:['Films','Live music','Nights out'],goal:'Gig buddies',prompt:'You’ll join my pub quiz team.',emoji:'🎬',colour:'cream',mode:'Chatty'}];
const seedPlans=[{id:'gig',title:'Anyone fancy a gig? 🎸',type:'Music',date:'2027-01-22',time:'19:30',area:'Manchester city centre',details:'Going to a gig and would love some company. Everyone gets their own ticket.',host:'Alex',spots:4,requests:1,emoji:'🎸'},{id:'coffee',title:'Sunday coffee & a yap ☕',type:'Coffee',date:'2027-01-24',time:'12:00',area:'Northern Quarter',details:'Low-pressure coffee and a chat with new friends.',host:'Jules',spots:6,requests:2,emoji:'☕'},{id:'walk',title:'A little weekend walk 🌿',type:'Outdoors',date:'2027-01-30',time:'11:00',area:'Heaton Park',details:'Beginner-friendly, no speed-walking required.',host:'Frankie',spots:8,requests:3,emoji:'🌿'}];
const sessions=[{id:'jan14',date:'2027-01-14',day:'Thu',time:'19:00',place:'Manchester city centre',capacity:24},{id:'jan21',date:'2027-01-21',day:'Thu',time:'19:00',place:'Manchester city centre',capacity:24},{id:'jan28',date:'2027-01-28',day:'Thu',time:'19:00',place:'Manchester city centre',capacity:36},{id:'feb04',date:'2027-02-04',day:'Thu',time:'19:00',place:'Manchester city centre',capacity:36}];
const questionnaire=[{q:'What are you hoping to find?',opts:['Close friendships','Activity buddies','Gig buddies','A bigger social circle']},{q:'What’s your social energy?',opts:['Quiet at first','Outgoing','Somewhere in between','Depends on the day']},{q:'Your ideal plans?',opts:['Coffee and chats','Gigs and nights out','Walks and outdoors','Food and restaurants']},{q:'Your ideal table vibe?',opts:['Calm and cosy','Chatty and lively','Balanced','Surprise me']},{q:'Your dinner budget?',opts:['Under £15','£15–25','£25–40','£40+']},{q:'Preferred meeting area?',opts:['City centre','Northern Quarter','Ancoats','Flexible']}];
const defaults={name:'',age:'',area:'Manchester',bio:'',interests:[],discoverable:false,notifications:true,subscription:'',qs:{},bookings:[],connections:[],introRequests:[],received:[],declined:[],liked:[],passed:[],messages:{},plans:[],joins:[],chatroom:'',restrictions:[],notes:'',adminMatches:[],onboarding:false};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(storage)||'{}')}}catch{state={...defaults}}let page='home',personFilter='All',peopleMode='discover',planFilter='All',quizIndex=0,viewPerson=null,toastTimer,swipeStart=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}),safeId=v=>String(v).replace(/[^a-z0-9-]/gi,'');function persist(){localStorage.setItem(storage,JSON.stringify(state))}function notify(t){const e=$('#toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),3300)}function go(p){page=p;viewPerson=null;render();window.scrollTo({top:0,behavior:'instant'})}const nav=[['home','⌂','Home'],['people','♡','People'],['dinners','♨','Dinners'],['plans','✳','Plans'],['chats','◉','Chats'],['me','☺','My profile'],['admin','⚙','Admin demo']];function renderNav(){$('#desktopNav').innerHTML=nav.map(([k,i,t])=>`<button class="nav-item ${page===k?'active':''}" onclick="go('${k}')"><span class="nav-icon">${i}</span>${t}</button>`).join('');$('#mobileNav').innerHTML=nav.slice(0,5).map(([k,i,t])=>`<button class="${page===k?'selected':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('');$('#memberBadge').textContent=state.subscription?state.subscription.toUpperCase()+' · DEMO':'NO LIVE MEMBERSHIP'}function render(){renderNav();$('#main').innerHTML=(screens[page]||screens.home)()}const pill=(x,c='')=>`<span class="tag ${c}">${esc(x)}</span>`;const who=id=>seedPeople.find(x=>x.id===id);function memberGate(){if(state.subscription)return true;notify('Choose a demo membership in My profile first.');go('me');return false}function section(title,subtitle='',right=''){return `<div class="section"><div><h2>${title}</h2>${subtitle?`<p class="subtitle">${subtitle}</p>`:''}</div>${right}</div>`}
function home(){return `<div class="hero"><div class="caps">GOOD PEOPLE. ACTUAL PLANS.</div><h1>Less swiping.<br>More yapping.</h1><p>Your sapphic friendship era starts here. Meet new people at dinner, find gig buddies, or make plans just because.</p><div class="row wrap"><button class="btn pink" onclick="go('people')">Find your people →</button><button class="btn outline" onclick="go('dinners')">Book a dinner</button></div></div>${section('Your next move','A whole lot of ways to meet someone new.') }<div class="grid three"><div class="panel"><div class="pill-num">01</div><h3 class="card-title">People you might love</h3><p class="subtitle">Browse profiles and send a friendly introduction.</p><button class="btn sm" onclick="go('people')">Meet people →</button></div><div class="panel"><div class="pill-num" style="background:var(--lilac)">02</div><h3 class="card-title">Your table awaits</h3><p class="subtitle">Book a weekly dinner with five matched strangers.</p><button class="btn sm" onclick="go('dinners')">See dates →</button></div><div class="panel"><div class="pill-num" style="background:var(--blue)">03</div><h3 class="card-title">Make some plans</h3><p class="subtitle">Gig, coffee, walk? Find someone to do it with.</p><button class="btn sm" onclick="go('plans')">Explore plans →</button></div></div>${section('Made for real connections')}<div class="grid"><div class="panel" style="background:var(--lilac)"><div class="eyebrow">YOUR MEMBERSHIP</div><h3 class="card-title">${state.subscription?esc(state.subscription)+' demo membership':'Your friendship era is waiting'}</h3><p>£9.99 monthly or £3.49 weekly. Same app access, subject to booking capacity.</p><button class="btn" onclick="go('me')">${state.subscription?'Manage demo plan':'Explore membership'}</button></div><div class="panel"><div class="eyebrow">COMING UP</div><h3 class="card-title">Thursday dinner 🍝</h3><p class="subtitle">A little good food and a lot of talking.</p><p>${pill('Manchester')} ${pill('7pm','pink')}</p><button class="btn pink" onclick="go('dinners')">Choose a date</button></div></div>`}
function availablePeople(){return seedPeople.filter(p=>(personFilter==='All'||p.interests.includes(personFilter))&&!state.passed.includes(p.id)&&!state.liked.includes(p.id)&&!state.connections.includes(p.id)&&!state.introRequests.includes(p.id)&&!state.declined.includes(p.id))}
function swipePerson(action,id){const p=who(id);if(!p)return;if(action==='like'){state.liked=[...new Set([...state.liked,p.id])];notify('💗 '+p.name+' added to Likes — you can send an introduction.')}else{state.passed=[...new Set([...state.passed,p.id])];notify('Passed on '+p.name+' — no notification sent.')}persist();render()}
function rewindSwipes(){state.passed=[];persist();render();notify('Passed profiles are available again')}
function showLikes(){peopleMode='likes';viewPerson=null;render()}
function beginSwipe(e,id){if(e.pointerType==='mouse'&&e.button!==0)return;swipeStart={id,x:e.clientX,y:e.clientY};const el=document.getElementById('swipe-card');if(el){el.classList.add('dragging');try{el.setPointerCapture(e.pointerId)}catch{}}}
function moveSwipe(e){if(!swipeStart)return;const dx=e.clientX-swipeStart.x;const el=document.getElementById('swipe-card');if(el){el.style.transform=`translateX(${Math.max(-160,Math.min(160,dx))}px) rotate(${Math.max(-9,Math.min(9,dx/18))}deg)`;el.dataset.direction=dx>55?'like':dx< -55?'pass':'';}}
function endSwipe(e){if(!swipeStart)return;const {id,x,y}=swipeStart;swipeStart=null;const dx=e.clientX-x,dy=e.clientY-y;const el=document.getElementById('swipe-card');if(el){el.classList.remove('dragging');el.style.transform='';el.dataset.direction=''}if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.25)swipePerson(dx>0?'like':'pass',id)}
function people(){if(viewPerson){const p=who(viewPerson);if(!p)return '<p>Member not found.</p>';const connected=state.connections.includes(p.id),requested=state.introRequests.includes(p.id),declined=state.declined.includes(p.id);return `<button class="btn outline sm" onclick="viewPerson=null;render()">← Back to People</button><div class="grid" style="margin-top:18px"><div class="panel"><div class="photo ${p.colour}"><span>${p.emoji}</span></div><div class="row between" style="margin-top:15px"><h2 style="margin:0">${esc(p.name)}, ${p.age}</h2>${pill(p.area,'blue')}</div><p class="subtitle">${esc(p.bio)}</p><div class="row wrap">${p.interests.map(t=>pill(t)).join('')}</div></div><div class="stack"><div class="panel"><div class="eyebrow">MY KIND OF PEOPLE</div><h3>${esc(p.goal)}</h3><p class="subtitle">${esc(p.prompt)}</p><div class="divider"></div><div class="eyebrow">SOCIAL VIBE</div><p>${esc(p.mode)}</p></div><div class="panel"><h3 class="card-title">Say hey 👋</h3><p class="subtitle">Send a short introduction. ${esc(p.name)} can choose whether to accept the conversation.</p>${connected?`<button class="btn pink" onclick="openChat('${p.id}')">Open chat →</button>`:requested?`<div class="notice">Introduction saved in demo mode. Awaiting acceptance.</div><button class="btn outline sm" onclick="cancelIntro('${p.id}')">Cancel request</button>`:declined?'<div class="notice">You have dismissed this profile in the demo.</div>':`<form onsubmit="sendIntro(event,'${p.id}')"><div class="field"><label>Your introduction</label><textarea name="intro" minlength="3" maxlength="280" required placeholder="Hey! I noticed you love gigs too..."></textarea></div><button class="btn pink full">Send introduction →</button></form>`}</div></div></div>`}
const tabs=`<div class="people-tabs" role="group" aria-label="People views"><button class="choice ${peopleMode==='discover'?'selected':''}" onclick="peopleMode='discover';render()">♡ Discover</button><button class="choice ${peopleMode==='likes'?'selected':''}" onclick="showLikes()">♥ Liked (${state.liked.filter(id=>!state.introRequests.includes(id)&&!state.connections.includes(id)).length})</button></div>`;
if(peopleMode==='likes'){const likes=state.liked.map(who).filter(Boolean);return `${section('Your liked people.','See someone you vibe with? Send a thoughtful introduction.',pill('People · not plans'))}${tabs}${likes.length?`<div class="grid three">${likes.map(p=>`<div class="panel"><div class="photo ${p.colour}"><span>${p.emoji}</span></div><h3 class="card-title">${esc(p.name)}, ${p.age}</h3><p class="subtitle">${esc(p.bio)}</p><div class="row wrap" style="margin-bottom:13px">${p.interests.map(x=>pill(x)).join('')}</div><button class="btn pink full" onclick="viewPerson='${p.id}';render()">${state.introRequests.includes(p.id)?'View sent intro':state.connections.includes(p.id)?'View connection':'Send introduction →'}</button></div>`).join('')}</div>`:`<div class="panel empty"><h3>No likes yet 💌</h3><p>Swipe right on someone you'd like to get to know. They won't receive anything until you send an introduction.</p><button class="btn pink" onclick="peopleMode='discover';render()">Discover people →</button></div>`}<div class="notice">Likes are private and local to this demo. No real member is notified.</div>`}
const matches=availablePeople(),p=matches[0];return `${section('Meet your people.','Swipe right to save a potential bestie, left to skip. No dating, just friendship.',pill('People · not plans'))}${tabs}<div class="row wrap" style="margin:16px 0 20px">${['All','Live music','Coffee','Books','Films','Food','Art','Walks'].map(t=>`<button class="choice ${personFilter===t?'selected':''}" onclick="personFilter='${t}';render()">${t}</button>`).join('')}</div>${p?`<div class="swipe-layout"><div class="swipe-zone"><div class="swipe-counter">${matches.length} new ${matches.length===1?'person':'people'} to discover</div><div class="swipe-stack"><div class="swipe-shadow shadow-two" aria-hidden="true"></div><div class="swipe-shadow shadow-one" aria-hidden="true"></div><article class="swipe-card" id="swipe-card" onpointerdown="beginSwipe(event,'${p.id}')" onpointermove="moveSwipe(event)" onpointerup="endSwipe(event)" onpointercancel="endSwipe(event)"><div class="swipe-stamp stamp-pass">PASS</div><div class="swipe-stamp stamp-like">LIKE ♡</div><div class="swipe-portrait ${p.colour}"><span class="swipe-emoji">${p.emoji}</span><span class="swipe-image-caption">${esc(p.goal)}</span></div><div class="swipe-content"><div class="row between"><h2 style="margin:0">${esc(p.name)}, ${p.age}</h2>${pill(p.area,'blue')}</div><p class="subtitle">${esc(p.bio)}</p><div class="row wrap">${p.interests.slice(0,3).map(t=>pill(t)).join('')}</div><div class="swipe-prompt"><small>WE'LL GET ALONG IF...</small><p>${esc(p.prompt)}</p></div><button class="swipe-view" onclick="viewPerson='${p.id}';render()">View full profile →</button></div></article></div><div class="swipe-actions"><button class="round-action pass-action" aria-label="Pass on ${esc(p.name)}" onclick="swipePerson('pass','${p.id}')">✕</button><button class="btn outline sm" onclick="viewPerson='${p.id}';render()">Full profile</button><button class="round-action like-action" aria-label="Like ${esc(p.name)}" onclick="swipePerson('like','${p.id}')">♥</button></div><p class="swipe-help">← Pass &nbsp; · &nbsp; Swipe or tap &nbsp; · &nbsp; Like →</p></div><div class="panel swipe-guide"><div class="eyebrow">HOW DISCOVERY WORKS</div><h3 class="card-title">Find your kind of people, at your pace.</h3><p class="subtitle">♥ <strong>Swipe right</strong> to save someone privately to your Likes.</p><p class="subtitle">✕ <strong>Swipe left</strong> to pass, with no awkward notifications.</p><p class="subtitle">💌 <strong>Send an intro</strong> from Likes or their full profile. A chat opens only after they accept.</p><div class="divider"></div><h3 class="card-title">Looking for actual plans?</h3><p class="subtitle">The Plans tab is separate — that's where you create a gig trip, coffee catch-up or group activity.</p><button class="btn lilac" onclick="go('plans')">Browse plans →</button></div></div>`:`<div class="panel empty"><h3>You've seen everyone for now 💗</h3><p>Check your Likes, try a different interest filter, or bring back skipped profiles.</p><div class="row wrap" style="justify-content:center"><button class="btn pink" onclick="showLikes()">See your Likes →</button><button class="btn outline" onclick="rewindSwipes()">See skipped profiles again</button></div></div>`}<div class="notice" style="margin-top:18px">All displayed people are fictional examples. Swipes and likes are stored only on your device; no real messages are sent. Live profile discovery will require opt-in.</div>`}
function sendIntro(e,id){e.preventDefault();if(!memberGate())return;const msg=e.target.intro.value.trim();if(msg.length<3)return;state.introRequests=[...new Set([...state.introRequests,id])];state.messages[id]=[{text:msg,mine:true,ts:Date.now(),type:'intro'}];persist();render();notify('Demo introduction saved. No message was delivered.')}function cancelIntro(id){state.introRequests=state.introRequests.filter(x=>x!==id);persist();render()}function acceptDemo(id){if(!memberGate())return;state.connections=[...new Set([...state.connections,id])];state.introRequests=state.introRequests.filter(x=>x!==id);persist();notify('Demo connection accepted!');go('chats')}function dismissPerson(id){state.declined=[...new Set([...state.declined,id])];state.introRequests=state.introRequests.filter(x=>x!==id);persist();render()}
function dinners(){return `${section('Dinner with five strangers.','Choose a Thursday, and let the matching do the rest.',pill('Weekly sessions','pink'))}<div class="grid">${sessions.map(s=>{const active=state.bookings.includes(s.id);return `<div class="panel"><div class="row between"><div class="pill-num" style="width:60px;height:60px;background:var(--pink)">${new Date(s.date+'T12:00:00').getDate()}</div>${pill('7pm · '+s.day)}</div><h3 class="card-title">${dateLabel(s.date)}</h3><p class="subtitle">📍 ${esc(s.place)}<br>🍽 Food and drinks paid separately<br>👯 Groups of six · ${s.capacity} total spaces</p><button class="btn ${active?'outline':'pink'} full" onclick="toggleBooking('${s.id}')">${active?'Cancel demo request':'Request dinner place →'}</button></div>`}).join('')}</div>${section('How the magic happens')}<div class="grid three">${[['1','Pick a date','Choose an evening that works for you.'],['2','Get matched','We build compatible tables with human review.'],['3','Meet your people','Restaurant reveal and chat before your dinner.']].map(a=>`<div class="panel"><div class="pill-num">${a[0]}</div><h3>${a[1]}</h3><p class="subtitle">${a[2]}</p></div>`).join('')}</div><div class="notice" style="margin-top:17px">These are illustrative sessions, not confirmed restaurant reservations. Your requests are saved locally and no seats are actually held.</div>`}function toggleBooking(id){if(!memberGate())return;state.bookings=state.bookings.includes(id)?state.bookings.filter(s=>s!==id):[...state.bookings,id];persist();render();notify(state.bookings.includes(id)?'Dinner request saved in demo mode':'Dinner request removed')}
function plans(){const all=[...seedPlans,...state.plans];const list=all.filter(e=>planFilter==='All'||e.type===planFilter);return `${section('Find your next plan.','No more “we should hang out sometime” and never doing it.',`<button class="btn pink" onclick="go('create')">＋ Create a plan</button>`)}<div class="row wrap" style="margin-bottom:18px">${['All','Music','Coffee','Outdoors','Food','Arts'].map(t=>`<button class="choice ${planFilter===t?'selected':''}" onclick="planFilter='${t}';render()">${t}</button>`).join('')}</div><div class="grid">${list.map(e=>`<div class="panel"><div class="row between">${pill(e.type)}<span style="font-size:35px">${e.emoji||'✨'}</span></div><h3 class="card-title">${esc(e.title)}</h3><p class="card-meta">${dateLabel(e.date)} · ${esc(e.time)} · ${esc(e.area)}</p><p class="subtitle">${esc(e.details)}</p><div class="divider"></div><div class="row between mobile-stack"><small>By ${esc(e.host)} · ${e.spots} spaces</small><button class="btn ${state.joins.includes(e.id)?'outline':'pink'} sm" onclick="joinPlan('${safeId(e.id)}')">${state.joins.includes(e.id)?'Withdraw request':'Request to join'}</button></div></div>`).join('')}</div>${section('An idea, not a full plan?')}<div class="panel" style="background:var(--lilac)"><h3 class="card-title">“I want to go pottery painting. Anyone?”</h3><p class="subtitle">You don’t need to have everything sorted. Post the idea and find people who are up for it. Collaborative scheduling comes in a later release.</p><button class="btn" onclick="go('create')">Post a plan →</button></div>`}function joinPlan(id){if(!memberGate())return;state.joins=state.joins.includes(id)?state.joins.filter(x=>x!==id):[...state.joins,id];persist();render();notify('Demo join-request status updated')}
function create(){return `${section('Create a plan','The group chat starts with one brave “anyone fancy...?”')}<div class="panel"><form onsubmit="createPlan(event)"><div class="grid"><div><div class="field"><label>What’s the plan?</label><input name="title" required maxlength="75" placeholder="Anyone fancy a gig?"></div><div class="field"><label>Category</label><select name="type"><option>Music</option><option>Coffee</option><option>Outdoors</option><option>Food</option><option>Arts</option><option>Other</option></select></div><div class="field"><label>Date</label><input type="date" name="date" min="2026-11-11" required></div></div><div><div class="field"><label>Time</label><input type="time" name="time" required></div><div class="field"><label>Broad public location</label><input name="area" maxlength="80" required placeholder="Northern Quarter"></div><div class="field"><label>Maximum participants</label><select name="spots"><option>2</option><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div></div></div><div class="field"><label>Tell us more</label><textarea name="details" required maxlength="400" placeholder="What's the vibe? Anything people need to bring?"></textarea></div><div class="notice">Pilot policy: public places only. No private home addresses, ticket sales, deposits, overnight trips or commercial promotions. Live events will require moderation.</div><p><button class="btn pink">Create demo plan →</button></p></form></div>`}function createPlan(e){e.preventDefault();if(!memberGate())return;const o=Object.fromEntries(new FormData(e.target).entries());if(o.date<'2026-11-11')return notify('Please choose a future date');state.plans.push({...o,id:'p'+Date.now(),host:state.name||'You',spots:Number(o.spots),emoji:'✳'});persist();notify('Demo plan saved on this device');go('plans')}
function openChat(id){state.chatroom=id;go('chats')};function chats(){const rooms=state.connections.map(id=>({id,name:who(id)?.name||id,desc:'Mutual connection'}));rooms.unshift({id:'intro',name:'Message requests',desc:state.introRequests.length+' pending demo requests'});if(state.bookings.length)rooms.push({id:'dinner',name:'Dinner crew 🍝',desc:'Example dinner chat'});if(state.joins.length)rooms.push({id:'plans',name:'Activity pals ✳',desc:'Example activity chat'});if(!state.chatroom)state.chatroom=rooms[0]?.id||'intro';const active=rooms.find(r=>r.id===state.chatroom)||rooms[0];let messages=state.messages[active.id]||[];return `${section('Your chats.','Real friendships start with a “hey”.',pill('Local demo'))}<div class="chat-wrap"><div class="chat-list">${rooms.map(r=>`<button class="chat-room ${active.id===r.id?'selected':''}" onclick="state.chatroom='${r.id}';persist();render()"><strong>${esc(r.name)}</strong><div class="card-meta">${esc(r.desc)}</div></button>`).join('')}</div><div class="panel"><h3 class="card-title">${esc(active.name)}</h3><div class="divider"></div>${active.id==='intro'?`<p class="subtitle">Intro requests are reviewed by the recipient before a chat opens.</p>${state.introRequests.length?state.introRequests.map(id=>`<div class="panel slim" style="margin-bottom:12px"><strong>${esc(who(id)?.name||id)}</strong><p class="card-meta">Demo outgoing introduction</p><p class="subtitle">${esc(state.messages[id]?.[0]?.text||'')}</p><div class="row wrap"><button class="btn pink sm" onclick="acceptDemo('${id}')">Simulate acceptance</button><button class="btn outline sm" onclick="cancelIntro('${id}');render()">Withdraw</button></div></div>`).join(''):'<div class="empty">No pending intros. Explore profiles to start a conversation.</div>'}`:`<div class="chat-log" id="chatLog"><div class="bubble">${active.id==='dinner'?'Welcome to your example dinner chat! Your real table chat would unlock after confirmation.':active.id==='plans'?'This is an example activity chat.':'You’re connected in the demo. Say hello!'} </div>${messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')}</div><form onsubmit="sendMessage(event,'${active.id}')" class="row" style="margin-top:13px"><input style="flex:1;min-width:0;padding:12px;border:1px solid #ccc;border-radius:12px" type="text" maxlength="500" name="msg" required aria-label="Message" placeholder="Write a message..."><button class="btn pink">Send</button></form>`}</div></div><div class="notice" style="margin-top:15px">Messages stay on your device. They are not delivered to another person or stored on a server.</div>`}function sendMessage(e,id){e.preventDefault();if(!memberGate())return;const t=e.target.msg.value.trim();if(!t)return;state.messages[id]=[...(state.messages[id]||[]),{text:t,mine:true,ts:Date.now()}];persist();render();const area=$('#chatLog');if(area)area.scrollTop=area.scrollHeight}
function me(){return `${section('Your space.','A little bit about you, a lot of potential friendships.') }<div class="grid"><div class="panel"><div class="row"><div class="avatar big">${esc((state.name||'☺').slice(0,1).toUpperCase())}</div><div><h3 class="card-title">${state.name?esc(state.name):'Your profile'}</h3><span class="card-meta">${esc(state.area)} · Friendship only</span></div></div><div class="divider"></div><form onsubmit="saveProfile(event)"><div class="field"><label>Display name</label><input name="name" required maxlength="40" value="${esc(state.name)}" placeholder="What should we call you?"></div><div class="grid"><div class="field"><label>Age (18+)</label><input type="number" min="18" max="100" name="age" value="${esc(state.age)}" placeholder="Your age"></div><div class="field"><label>Broad area</label><select name="area">${['Manchester','Salford','Stockport','Trafford','Other'].map(a=>`<option ${state.area===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="field"><label>About you</label><textarea name="bio" maxlength="300" placeholder="Your vibe, what you love, what you’re looking for...">${esc(state.bio)}</textarea></div><div class="field"><label>Interests (separated by commas)</label><input name="interests" value="${esc(state.interests.join(', '))}" placeholder="Coffee, gigs, film, food"></div><label class="toggle"><input type="checkbox" name="discoverable" ${state.discoverable?'checked':''}> Let eligible members discover my profile</label><p class="caption">Off by default. This demo does not publish anything online.</p><button class="btn pink">Save my profile →</button></form></div><div class="stack"><div class="panel" style="background:var(--lilac)"><div class="eyebrow">MEMBERSHIP</div><h3 class="card-title">${state.subscription?esc(state.subscription)+' demo membership':'Join the friendship club'}</h3><div class="grid"><div class="plan-card" style="background:var(--paper)"><div class="eyebrow">MONTHLY</div><div class="price">£9.99</div><p class="card-meta">per month</p><button class="btn sm ${state.subscription==='Monthly'?'outline':'pink'}" onclick="choosePlan('Monthly')">${state.subscription==='Monthly'?'Selected':'Choose'}</button></div><div class="plan-card" style="background:var(--paper)"><div class="eyebrow">WEEKLY</div><div class="price">£3.49</div><p class="card-meta">per week</p><button class="btn sm ${state.subscription==='Weekly'?'outline':'pink'}" onclick="choosePlan('Weekly')">${state.subscription==='Weekly'?'Selected':'Choose'}</button></div></div>${state.subscription?'<p><button class="btn outline sm" onclick="choosePlan(\'\')">Cancel demo membership</button></p>':''}<p class="caption">Demo plan selector only. No Shopify checkout, subscription or charge takes place.</p></div><div class="panel"><h3 class="card-title">Account & safety</h3><p class="subtitle">Discovery visibility, notifications and blocking will be enforceable server-side in the production build.</p><label class="toggle"><input type="checkbox" ${state.notifications?'checked':''} onchange="state.notifications=this.checked;persist()"> Notifications enabled (demo)</label><div class="divider"></div><button class="btn outline sm" onclick="resetDemo()">Reset local demo</button></div></div></div>${section('Friendship questionnaire','Help us learn who you might click with.',pill((Object.keys(state.qs).length)+'/'+questionnaire.length+' answered','blue'))}<div class="panel"><div class="row between"><span class="eyebrow">QUESTION ${quizIndex+1} OF ${questionnaire.length}</span><span class="caption">You can change this later</span></div><div class="progress" style="margin:12px 0"><div style="width:${(quizIndex+1)/questionnaire.length*100}%"></div></div><h3 class="card-title">${esc(questionnaire[quizIndex].q)}</h3><div class="choicebar">${questionnaire[quizIndex].opts.map(t=>`<button class="choice ${state.qs[quizIndex]===t?'selected':''}" onclick="chooseAnswer(${quizIndex},'${encodeURIComponent(t)}')">${esc(t)}</button>`).join('')}</div><div class="row between" style="margin-top:21px"><button class="btn outline sm" onclick="quizIndex=Math.max(0,quizIndex-1);render()">← Back</button><button class="btn sm" onclick="quizIndex=Math.min(${questionnaire.length-1},quizIndex+1);render()">Next →</button></div></div>`}function saveProfile(e){e.preventDefault();let f=new FormData(e.target);state.name=(f.get('name')||'').trim();state.age=f.get('age');state.area=f.get('area');state.bio=f.get('bio').trim();state.interests=f.get('interests').split(',').map(a=>a.trim()).filter(Boolean).slice(0,12);state.discoverable=f.has('discoverable');persist();notify('Profile saved in this browser');render()}function choosePlan(p){state.subscription=p;persist();render();notify(p?`${p} demo membership selected`:'Demo membership cancelled')}function chooseAnswer(i,v){state.qs[i]=decodeURIComponent(v);persist();render()}function resetDemo(){if(confirm('Remove all your locally saved demo profile, messages, requests and bookings?')){localStorage.removeItem(storage);location.reload()}}
function admin(){const filled=state.bookings.length;const people=[...seedPeople].sort((a,b)=>a.name.localeCompare(b.name));let matchDemo=state.adminMatches;return `${section('Organiser studio.','A preview of the QueerMCR operational controls.',pill('Demo only'))}<div class="grid three"><div class="panel"><div class="eyebrow">DINNER REQUESTS</div><div class="kpi">${filled}</div><p class="card-meta">This device</p></div><div class="panel"><div class="eyebrow">MEMBER PLANS</div><div class="kpi">${state.plans.length}</div><p class="card-meta">Created locally</p></div><div class="panel"><div class="eyebrow">INTRO REQUESTS</div><div class="kpi">${state.introRequests.length}</div><p class="card-meta">This device</p></div></div>${section('Table matching sandbox','Demo with six fictional, consent-free test profiles.') }<div class="panel"><p class="subtitle">Match six sample profiles into one table. This uses overlapping interests, goals and social energy for an illustrative ranking. Production matching additionally needs paid booking checks, venue suitability, safety exclusions, repeat-match history, allocation fairness and organiser approval.</p><button class="btn pink" onclick="generateMatches()">✳ Generate example match</button>${matchDemo.length?`<div class="divider"></div><h3 class="card-title">Suggested table of six</h3><div class="row wrap">${matchDemo.map(id=>pill(who(id)?.name||id)).join('')}</div><p class="caption">Not approved; nothing is sent to members.</p>`:''}</div>${section('Launch checklist')}<div class="panel"><p>□ Shopify subscription app and selling plans</p><p>□ Authenticated member accounts and secure sessions</p><p>□ Subscription status webhooks</p><p>□ Server database for profiles, chats and events</p><p>□ Consent, eligibility and privacy controls</p><p>□ Block/report and moderation dashboard</p><p>□ Restaurant capacity and accessibility checks</p><p>□ Payments, refunds and cancellation policies</p></div>`}function generateMatches(){const ordered=[...seedPeople].sort((a,b)=>{let goal=state.qs[0];const score=p=>(p.interests.filter(x=>state.interests.includes(x)).length*3)+(p.goal===goal?4:0);return score(b)-score(a)});state.adminMatches=ordered.map(x=>x.id);persist();render();notify('Example table generated for organiser review')}
const screens={home,people,dinners,plans,create,chats,me,admin};render();
</script></body></html>
